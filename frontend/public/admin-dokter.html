<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Dokter & Jadwal - Talha Medical Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { k_red: '#B91C1C' } } } }
    </script>
    <script>
        if (!localStorage.getItem('klinik_admin_token')) {
            window.location.href = '/login.html';
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

<div id="app-header"></div>

<div class="container mx-auto px-6 py-10">
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h2 class="text-3xl font-bold text-gray-800 border-l-4 border-k_red pl-4">Manajemen Dokter & Jadwal</h2>
        <div class="text-gray-600">Halo, <span id="admin-name" class="font-bold">...</span></div>
    </div>

    <div id="admin-subnav"></div>

    <div id="error-banner" class="hidden mb-4 bg-red-100 border border-red-400 text-red-800 rounded-lg px-4 py-3 text-sm"></div>
    <div id="success-banner" class="hidden mb-4 bg-green-100 border border-green-400 text-green-800 rounded-lg px-4 py-3 text-sm"></div>

    <!-- Tambah Dokter Baru -->
    <div class="bg-white rounded-lg shadow p-5 mb-6">
        <h3 class="font-bold text-gray-800 mb-3">+ Tambah Dokter Baru</h3>
        <form id="add-doctor-form" class="flex flex-wrap gap-3 items-end">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Nama Dokter</label>
                <input name="nama" required minlength="3" maxlength="100" placeholder="Dr. Contoh Nama"
                    class="border rounded-lg px-3 py-2 text-sm w-64">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Poli</label>
                <select name="poli" class="border rounded-lg px-3 py-2 text-sm">
                    <option value="Umum">Umum</option>
                    <option value="Gigi">Gigi</option>
                    <option value="Anak">Anak</option>
                </select>
            </div>
            <button type="submit" class="bg-k_red text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-red-800">Tambah</button>
        </form>
    </div>

    <div id="doctor-list" class="space-y-6">
        <p class="text-center text-gray-500 py-8">Memuat data dokter...</p>
    </div>
</div>

<div id="app-footer"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/components/layout.js"></script>
<script src="/assets/js/admin-dokter.js"></script>
</body>
</html>
